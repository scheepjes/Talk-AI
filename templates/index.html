<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk AI Wrapper</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
        .chat-container { height: calc(100vh - 200px); }
        .message-a { background-color: #e0f2fe; align-self: flex-start; }
        .message-b { background-color: #f0fdf4; align-self: flex-end; }
        .message-user { background-color: #f3f4f6; align-self: center; font-style: italic; }
    </style>
</head>
  <body class="bg-gray-100 font-sans min-h-screen">
    <div class="container mx-auto max-w-6xl p-2">
        <header class="flex justify-between items-center mb-2">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Talk AI Conversation</h1>
                <p class="text-gray-600 text-sm" data-i18n="subtitle">Two LLMs in conversation</p>
            </div>
            <div class="flex items-center space-x-2">
                <select id="language-select" onchange="setUILanguage(this.value)" class="border border-gray-300 rounded-md shadow-sm p-2 text-sm">
                    <option value="en">English</option>
                    <option value="nl" selected>Nederlands</option>
                </select>
                <button onclick="openHistoryModal()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg hover:bg-indigo-700 transition text-sm">
                    <span class="hidden sm:inline">📚</span> <span data-i18n="history">History</span>
                </button>
            </div>
        </header>

        <!-- Setup Form -->
        <div id="setup-section" class="bg-white p-3 rounded-lg shadow-md mb-2">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Server A</label>
                    {% set last_key = server_models.keys()|last %}
                    {% set default_a = last_key %}
                    {% set default_b = last_key %}
                    <select id="server_a_url" onchange="serverUrls.a=this.value" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-sm">
                        {% for url, name in server_models.items() %}
                        <option value="{{ url }}"{% if url == default_a %} selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Server B</label>
                    <select id="server_b_url" onchange="serverUrls.b=this.value" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-sm">
                        {% for url, name in server_models.items() %}
                        <option value="{{ url }}"{% if url == default_b %} selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700" data-i18n="topic_label">Topic</label>
                    <textarea id="topic" rows="5" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3" data-i18n-placeholder="topic_placeholder" placeholder="e.g. The future of AI"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700" data-i18n="depth_label">Depth</label>
                    <select id="depth_level" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </select>
                </div>
            </div>
            <button onclick="startConversation()" id="start-btn" class="mt-2 w-full bg-blue-600 text-white py-1 px-3 rounded-md hover:bg-blue-700 transition text-sm" data-i18n="start_conversation">Start Conversation</button>
        </div>

        <!-- Chat Display -->
        <div id="chat-section" class="hidden">
            <div id="chat-window" class="chat-container bg-white p-2 rounded-lg shadow-inner overflow-y-auto mb-2">
            </div>
            
            <div class="bg-white p-3 rounded-lg shadow-md mb-2">
                <div id="loading-indicator" class="hidden flex items-center space-x-2 mb-2">
                    <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
                    <span class="text-sm text-gray-600" data-i18n="thinking">Thinking...</span>
                </div>
                
                <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="question_label">Ask a new question (optional)</label>
                <textarea id="user-question" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-sm" data-i18n-placeholder="question_placeholder" placeholder="Type your question here..."></textarea>
                <div class="flex space-x-2 mt-2">
                    <button onclick="askQuestion()" id="ask-btn" class="flex-1 bg-purple-600 text-white py-1 px-3 rounded-md hover:bg-purple-700 transition text-sm" data-i18n="ask_question">Ask Question</button>
                    <button onclick="nextTurn()" id="next-btn" class="flex-1 bg-green-600 text-white py-1 px-3 rounded-md hover:bg-green-700 transition text-sm" data-i18n="next_round">Next Round</button>
                    <select id="rounds-select" class="border border-gray-300 rounded-md shadow-sm p-1 text-sm w-10">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                    </select>
                      <button onclick="location.reload()" class="bg-gray-500 text-white py-1 px-3 rounded-md hover:bg-gray-600 transition text-sm" data-i18n="new">New</button>
                </div>
            </div>
        </div>

        <!-- History Modal -->
        <div id="history-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
            <div class="bg-white rounded-lg shadow-2xl w-96 max-h-[80vh] overflow-y-auto">
                <div class="p-4">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800" data-i18n="conv_history_title">Conversation History</h2>
                        <button onclick="closeHistoryModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                    </div>
                    
                    <div id="history-list" class="space-y-2">
                        <div class="text-center text-gray-500 py-4" data-i18n="loading">Loading...</div>
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-gray-200">
                        <button onclick="deleteAllConversations()" class="w-full bg-red-600 text-white py-2 px-3 rounded-md hover:bg-red-700 transition text-sm">
                            🗑️ <span data-i18n="delete_all">Delete All</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        </div>

    <script>
        // --- i18n translations ---
        const i18n = {
            en: {
                subtitle: "Two LLMs in conversation",
                history: "History",
                topic_label: "Topic",
                topic_placeholder: "e.g. The future of AI",
                depth_label: "Depth",
                start_conversation: "Start Conversation",
                thinking: "Thinking...",
                question_label: "Ask a new question (optional)",
                question_placeholder: "Type your question here...",
                ask_question: "Ask Question",
                next_round: "Next Round",
                new: "New",
                conv_history_title: "Conversation History",
                loading: "Loading...",
                delete_all: "Delete All",
                no_conversations: "No conversations found",
                error_loading: "Error loading conversations",
                enter_topic: "Enter a topic!",
                enter_question: "Enter a question!",
                network_error: "Network error: ",
                round_of: "Round {current} of {total}...",
                depth_level: "Depth level: ",
                system: "System: ",
                view: "View",
                delete: "Delete",
                confirm_delete: "Are you sure you want to delete this conversation?",
                confirm_delete_all: "Are you sure you want to delete ALL conversations? This cannot be undone.",
                error_loading_conv: "Error loading conversation",
                error_deleting_conv: "Error deleting conversation",
                error_deleting_convs: "Error deleting conversations",
                read_aloud: "Read aloud",
                stop_speaking: "Stop",
                speaking: "Speaking...",
                depth: {
                    1: "Brief and concise. Give only factual answers without elaboration.",
                    2: "Normal conversation. Keep the conversation lively and polite.",
                    3: "Depth and philosophy. Analyze the subject thoroughly and explore nuances.",
                    4: "Expert level. Treat the subject as a specialist, with deep logical reasoning.",
                }
            },
            nl: {
                subtitle: "Twee LLM's in gesprek",
                history: "Geschiedenis",
                topic_label: "Onderwerp",
                topic_placeholder: "Bijv. De toekomst van AI",
                depth_label: "Diepte",
                start_conversation: "Start Conversatie",
                thinking: "Aan het denken...",
                question_label: "Nieuwe vraag stellen (optioneel)",
                question_placeholder: "Typ hier je vraag...",
                ask_question: "Vraag Stellen",
                next_round: "Volgende Ronde",
                new: "Nieuw",
                conv_history_title: "Conversatie Geschiedenis",
                loading: "Laden...",
                delete_all: "Alles verwijderen",
                no_conversations: "Geen conversaties gevonden",
                error_loading: "Fout bij het laden van conversaties",
                enter_topic: "Voer een onderwerp in!",
                enter_question: "Voer een vraag in!",
                network_error: "Netwerk fout: ",
                round_of: "Ronde {current} van {total}...",
                depth_level: "Diepte niveau: ",
                system: "Systeem: ",
                view: "Bekijken",
                delete: "Verwijder",
                confirm_delete: "Weet je zeker dat je deze conversatie wilt verwijderen?",
                confirm_delete_all: "Weet je zeker dat je ALLE conversaties wilt verwijderen? Dit kan niet ongedaan worden gemaakt.",
                error_loading_conv: "Fout bij het laden van conversatie",
                error_deleting_conv: "Fout bij het verwijderen van conversatie",
                error_deleting_convs: "Fout bij het verwijderen van conversaties",
                read_aloud: "Voorlezen",
                stop_speaking: "Stoppen",
                speaking: "Aan het voorlezen...",
                depth: {
                    1: "Kort en bondig. Geef alleen feitelijke antwoorden zonder uitwijdingen.",
                    2: "Normale conversatie. Houd het gesprek levendig en beleefd.",
                    3: "Diepgang en filosofie. Analyseer het onderwerp grondig en ga in op nuances.",
                    4: "Expert niveau. Behandel het onderwerp als een specialist, met diepgaande logica.",
                }
            }
        };

        let currentLanguage = '{{ language }}';

        function t(key) {
            return i18n[currentLanguage][key] || i18n['en'][key] || key;
        }

        function setUILanguage(lang) {
            currentLanguage = lang;
            fetch('/set_language', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ language: lang }),
                credentials: 'include'
            }).catch(() => {});

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = t(key);
            });
            populateDepthOptions();
        }

        function populateDepthOptions() {
            const select = document.getElementById('depth_level');
            const currentVal = select.value;
            select.innerHTML = '';
            const depthTemplates = i18n[currentLanguage].depth;
            for (const [level, text] of Object.entries(depthTemplates)) {
                const opt = document.createElement('option');
                opt.value = level;
                opt.textContent = text;
                if (!currentVal || level == currentVal) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            }
            if (!currentVal) {
                select.value = '2';
            }
        }

        // --- App state ---
        let conversationStarted = false;
        let activeConversationId = null;
        let loadedConversationData = null;
        let serverUrls = {
            a: document.getElementById('server_a_url').value,
            b: document.getElementById('server_b_url').value
        };

        // Set initial language selector
        document.getElementById('language-select').value = currentLanguage;
        populateDepthOptions();

        async function startConversation() {
            const topic = document.getElementById('topic').value;
            const depth_level = document.getElementById('depth_level').value;

            if (!topic) {
                alert(t("enter_topic"));
                return;
            }

            document.getElementById('start-btn').disabled = true;
            try {
                const response = await fetch('/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ topic, depth_level, server_a_url: serverUrls.a, server_b_url: serverUrls.b, language: currentLanguage }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.conversation_id) {
                        activeConversationId = result.conversation_id;
                    }
                    document.getElementById('setup-section').classList.add('hidden');
                    document.getElementById('chat-section').classList.remove('hidden');
                    conversationStarted = true;
                    nextTurn();
                } else {
                    const err = await response.json();
                    alert("Error: " + err.error);
                    document.getElementById('start-btn').disabled = false;
                }
            } catch (e) {
                alert(t("network_error") + e.message);
                document.getElementById('start-btn').disabled = false;
            }
        }

        async function nextTurn() {
            if (!conversationStarted || !activeConversationId) return;

            const rounds = parseInt(document.getElementById('rounds-select').value) || 1;

            document.getElementById('next-btn').disabled = true;
            document.getElementById('ask-btn').disabled = true;
            document.getElementById('loading-indicator').classList.remove('hidden');
            updateLoadingText(1, rounds);

            let success = true;
            for (let i = 0; i < rounds; i++) {
                updateLoadingText(i + 1, rounds);
                try {
                    const response = await fetch('/next_turn', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        credentials: 'include',
                        body: JSON.stringify({
                            conversation_id: activeConversationId,
                            server_a_url: serverUrls.a,
                            server_b_url: serverUrls.b,
                            language: currentLanguage
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        renderHistory(data.history);
                    } else {
                        const err = await response.json();
                        alert("Error: " + err.error);
                        success = false;
                        break;
                    }
                } catch (e) {
                    alert(t("network_error") + e.message);
                    success = false;
                    break;
                }
            }

            resetLoadingText();
            document.getElementById('next-btn').disabled = false;
            document.getElementById('ask-btn').disabled = false;
            document.getElementById('loading-indicator').classList.add('hidden');
        }

        async function askQuestion() {
            if (!conversationStarted || !activeConversationId) return;

            const question = document.getElementById('user-question').value.trim();
            if (!question) {
                alert(t("enter_question"));
                return;
            }

            document.getElementById('ask-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('loading-indicator').classList.remove('hidden');
            try {
                const response = await fetch('/ask_question', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        question,
                        conversation_id: activeConversationId,
                        server_a_url: serverUrls.a,
                        server_b_url: serverUrls.b,
                        language: currentLanguage
                    }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    renderHistory(data.history);
                    document.getElementById('user-question').value = '';
                } else {
                    const err = await response.json();
                    alert("Error: " + err.error);
                }
            } catch (e) {
                alert(t("network_error") + e.message);
            }
            document.getElementById('ask-btn').disabled = false;
            document.getElementById('next-btn').disabled = false;
            document.getElementById('loading-indicator').classList.add('hidden');
        }

        function updateLoadingText(current, total) {
            const span = document.getElementById('loading-indicator').querySelector('span');
            const template = t('round_of');
            span.textContent = template.replace('{current}', current).replace('{total}', total);
        }

        function resetLoadingText() {
            const span = document.getElementById('loading-indicator').querySelector('span');
            span.textContent = t('thinking');
        }

        // --- Speech synthesis ---
        function stripHtmlTags(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function stopAllSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            document.querySelectorAll('.read-aloud-btn').forEach(btn => {
                btn.innerHTML = '🔊 ' + t('read_aloud');
                btn.disabled = false;
            });
        }

        function speakText(text, lang, btn) {
            if (!('speechSynthesis' in window)) {
                alert('Speech synthesis is not supported in this browser.');
                return;
            }

            const speech = window.speechSynthesis;

            if (speech.speaking) {
                speech.cancel();
                if (btn) {
                    btn.innerHTML = '🔊 ' + t('read_aloud');
                    btn.disabled = false;
                }
                return;
            }

            const plainText = stripHtmlTags(text);
            const utterance = new SpeechSynthesisUtterance(plainText);
            utterance.lang = lang === 'nl' ? 'nl-NL' : 'en-US';
            utterance.rate = 1;
            utterance.pitch = 1;

            document.querySelectorAll('.read-aloud-btn').forEach(b => {
                if (b !== btn) {
                    b.innerHTML = '🔊 ' + t('read_aloud');
                }
            });
            if (btn) {
                btn.innerHTML = '🔇 ' + t('speaking');
                btn.disabled = false;
            }

            utterance.onend = () => {
                if (btn) {
                    btn.innerHTML = '🔊 ' + t('read_aloud');
                    btn.disabled = false;
                }
            };

            utterance.onerror = () => {
                if (btn) {
                    btn.innerHTML = '🔊 ' + t('read_aloud');
                    btn.disabled = false;
                }
            };

            speech.speak(utterance);
        }

        function renderHistory(history) {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';

            history.forEach(msg => {
                if (msg.display === false) return;
                
                const div = document.createElement('div');
                
                if (msg.role === 'system') {
                    div.className = 'w-full text-center text-xs text-gray-400 italic my-2';
                    div.innerText = t("system") + msg.content;
                } else if (msg.role === 'user') {
                    div.className = 'max-w-[80%] ml-auto mr-0 p-2 rounded-lg shadow-sm bg-gray-200 text-xs italic text-gray-700 mb-2';
                    div.innerText = msg.content;
                } else {
                    const isA = msg.sender === 'Server A';
                    const alignClass = isA ? 'mr-auto' : 'ml-auto';
                    const bgClass = isA ? 'bg-blue-100 border-l-4 border-blue-500' : 'bg-green-100 border-r-4 border-green-500';
                    div.className = `max-w-[80%] ${alignClass} p-2 rounded-lg shadow-sm ${bgClass} mb-2`;
                    let formattedContent = msg.content
                        .replace(/^###### (.+)$/gm, '<h6 class="text-xs font-semibold mt-1">$1</h6>')
                        .replace(/^##### (.+)$/gm, '<h5 class="text-sm font-semibold mt-2">$1</h5>')
                        .replace(/^#### (.+)$/gm, '<h4 class="text-base font-semibold mt-2">$1</h4>')
                        .replace(/^### (.+)$/gm, '<h3 class="text-lg font-semibold mt-2">$1</h3>')
                        .replace(/^## (.+)$/gm, '<h2 class="text-xl font-bold mt-3">$1</h2>')
                        .replace(/^# (.+)$/gm, '<h1 class="text-2xl font-bold mt-3 mb-1">$1</h1>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/\n\n/g, '</p><p class="mt-1">')
                        .replace(/\n/g, '<br>');
                    div.innerHTML = `
                        <div class="flex items-center justify-between">
                            <strong>${msg.sender}:</strong>
                            <button class="ml-2 text-xs bg-white bg-opacity-60 hover:bg-opacity-100 rounded px-2 py-1 transition read-aloud-btn" title="${t('read_aloud')}">🔊 ${t('read_aloud')}</button>
                        </div>
                        <div class="mt-1 text-sm"><p>${formattedContent}</p></div>
                    `;
                    div.querySelector('.read-aloud-btn').addEventListener('click', function() {
                        speakText(`<p>${formattedContent}</p>`, currentLanguage, this);
                    });
                }
                
                chatWindow.appendChild(div);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // --- Modal functionality ---
        function openHistoryModal() {
            document.getElementById('history-modal').classList.remove('hidden');
            loadConversations();
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        async function loadConversations() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '<div class="text-center text-gray-500 py-4">' + t('loading') + '</div>';
            
            try {
                const response = await fetch('/api/conversations', {
                    credentials: 'include'
                });
                const conversations = await response.json();
                
                if (conversations.length === 0) {
                    historyList.innerHTML = '<div class="text-center text-gray-500 py-4">' + t('no_conversations') + '</div>';
                    return;
                }
                
                historyList.innerHTML = '';
                conversations.forEach(conv => {
                    const div = document.createElement('div');
                    div.className = 'bg-gray-50 p-3 rounded-lg border border-gray-200';
                    const locale = currentLanguage === 'nl' ? 'nl-NL' : 'en-US';
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <h3 class="font-semibold text-sm text-gray-800">${escapeHtml(conv.topic)}</h3>
                                <p class="text-xs text-gray-500 mt-1">${new Date(conv.created_at).toLocaleString(locale)}</p>
                                <p class="text-xs text-gray-400 mt-1">${t('depth_level')}${conv.depth_level}</p>
                            </div>
                            <div class="flex space-x-1">
                                <button onclick="viewConversation('${conv.id}')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">${t('view')}</button>
                                <button onclick="deleteConversation('${conv.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">${t('delete')}</button>
                            </div>
                        </div>
                    `;
                    historyList.appendChild(div);
                });
            } catch (error) {
                historyList.innerHTML = '<div class="text-center text-red-500 py-4">' + t('error_loading') + '</div>';
            }
        }

        async function viewConversation(conversationId) {
            try {
                const loadResponse = await fetch(`/api/conversations/${conversationId}/load`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (!loadResponse.ok) {
                    alert(t('error_loading_conv'));
                    return;
                }
                
                const loadData = await loadResponse.json();
                
                activeConversationId = conversationId;
                loadedConversationData = loadData;
                if (loadData.language) {
                    currentLanguage = loadData.language;
                    setUILanguage(currentLanguage);
                }
                if (loadData.server_a_url) {
                    serverUrls.a = loadData.server_a_url;
                    document.getElementById('server_a_url').value = loadData.server_a_url;
                } else {
                    serverUrls.a = document.getElementById('server_a_url').value;
                }
                if (loadData.server_b_url) {
                    serverUrls.b = loadData.server_b_url;
                    document.getElementById('server_b_url').value = loadData.server_b_url;
                } else {
                    serverUrls.b = document.getElementById('server_b_url').value;
                }
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('chat-section').classList.remove('hidden');
                conversationStarted = true;
                
                renderHistory(loadData.history);
                
                closeHistoryModal();
            } catch (error) {
                alert(t('error_loading_conv') + ': ' + error.message);
            }
        }

        async function deleteConversation(conversationId) {
            if (!confirm(t('confirm_delete'))) {
                return;
            }
            
            try {
                const response = await fetch(`/api/conversations/${conversationId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    loadConversations();
                } else {
                    alert(t('error_deleting_conv'));
                }
            } catch (error) {

        async function deleteAllConversations() {
            if (!confirm(t('confirm_delete_all'))) {
                return;
            }
            
            try {
                const response = await fetch('/api/conversations', {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    loadConversations();
                } else {
                    alert(t('error_deleting_convs'));
                }
            } catch (error) {
                alert(t('error_deleting_convs'));
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
