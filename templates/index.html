<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk AI Wrapper</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
      <style>
        .chat-container { height: calc(100vh - 200px); }
        .message-a { background-color: #e0f2fe; align-self: flex-start; }
        .message-b { background-color: #f0fdf4; align-self: flex-end; }
        .message-user { background-color: #f3f4f6; align-self: center; font-style: italic; }
    </style>
</head>
  <body class="bg-gray-100 font-sans min-h-screen">
    <div class="container mx-auto max-w-6xl p-2">
        <header class="text-center mb-2">
            <h1 class="text-2xl font-bold text-gray-800">Talk AI Conversation</h1>
            <p class="text-gray-600 text-sm">Twee LLM's in gesprek</p>
        </header>

        <!-- Setup Form -->
        <div id="setup-section" class="bg-white p-3 rounded-lg shadow-md mb-2">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Onderwerp</label>
                    <textarea id="topic" rows="5" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3" placeholder="Bijv. De toekomst van AI"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Diepte</label>
                    <select id="depth_level" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                        {% for level, text in depth_templates.items() %}
                            <option value="{{ level }}">{{ text }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <button onclick="startConversation()" id="start-btn" class="mt-2 w-full bg-blue-600 text-white py-1 px-3 rounded-md hover:bg-blue-700 transition text-sm">Start Conversatie</button>
        </div>

        <!-- Chat Display -->
        <div id="chat-section" class="hidden">
            <div id="chat-window" class="chat-container bg-white p-2 rounded-lg shadow-inner overflow-y-auto flex flex-col space-y-2 mb-2">
                <!-- Messages appear here -->
            </div>
            
            <div class="bg-white p-3 rounded-lg shadow-md mb-2">
                <!-- Loading Indicator -->
                <div id="loading-indicator" class="hidden flex items-center space-x-2 mb-2">
                    <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
                    <span class="text-sm text-gray-600">Aan het denken...</span>
                </div>
                
                <label class="block text-xs font-medium text-gray-700 mb-1">Nieuwe vraag stellen (optioneel)</label>
                <textarea id="user-question" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-sm" placeholder="Typ hier je vraag..."></textarea>
                <div class="flex space-x-2 mt-2">
                    <button onclick="askQuestion()" id="ask-btn" class="flex-1 bg-purple-600 text-white py-1 px-3 rounded-md hover:bg-purple-700 transition text-sm">Vraag Stellen</button>
                    <button onclick="nextTurn()" id="next-btn" class="flex-1 bg-green-600 text-white py-1 px-3 rounded-md hover:bg-green-700 transition text-sm">Volgende Ronde</button>
                    <button onclick="location.reload()" class="bg-gray-500 text-white py-1 px-3 rounded-md hover:bg-gray-600 transition text-sm">Reset</button>
                </div>
            </div>
        </div>

        </div>

    <script>
        let conversationStarted = false;

        async function startConversation() {
            const topic = document.getElementById('topic').value;
            const depth_level = document.getElementById('depth_level').value;

            if (!topic) {
                alert("Voer een onderwerp in!");
                return;
            }

            document.getElementById('start-btn').disabled = true;
            const response = await fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ topic, depth_level })
            });

            if (response.ok) {
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('chat-section').classList.remove('hidden');
                conversationStarted = true;
                nextTurn();
            } else {
                const err = await response.json();
                alert("Error: " + err.error);
                document.getElementById('start-btn').disabled = false;
            }
        }

        async function nextTurn() {
            if (!conversationStarted) return;

            document.getElementById('next-btn').disabled = true;
            document.getElementById('ask-btn').disabled = true;
            document.getElementById('loading-indicator').classList.remove('hidden');
            const response = await fetch('/next_turn', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });

            if (response.ok) {
                const data = await response.json();
                renderHistory(data.history);
            } else {
                const err = await response.json();
                alert("Error: " + err.error);
            }
            document.getElementById('next-btn').disabled = false;
            document.getElementById('ask-btn').disabled = false;
            document.getElementById('loading-indicator').classList.add('hidden');
        }

        async function askQuestion() {
            if (!conversationStarted) return;

            const question = document.getElementById('user-question').value.trim();
            if (!question) {
                alert("Voer een vraag in!");
                return;
            }

            document.getElementById('ask-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('loading-indicator').classList.remove('hidden');
            const response = await fetch('/ask_question', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question })
            });

            if (response.ok) {
                const data = await response.json();
                renderHistory(data.history);
                document.getElementById('user-question').value = '';
            } else {
                const err = await response.json();
                alert("Error: " + err.error);
            }
            document.getElementById('ask-btn').disabled = false;
            document.getElementById('next-btn').disabled = false;
            document.getElementById('loading-indicator').classList.add('hidden');
        }

          function renderHistory(history) {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';

            history.forEach(msg => {
                if (msg.display === false) return;
                
                const div = document.createElement('div');
                div.className = 'max-w-[80%] p-3 rounded-lg shadow-sm';
                
                if (msg.role === 'system') {
                    div.className = 'w-full text-center text-xs text-gray-400 italic my-2';
                    div.innerText = "Systeem: " + msg.content;
                } else if (msg.role === 'user') {
                    div.className = 'max-w-[80%] p-2 rounded-lg shadow-sm bg-gray-200 self-center text-xs italic text-gray-700';
                    div.innerText = msg.content;
                } else {
                    // Assistant (Server A or B)
                    const isA = msg.sender === 'Server A';
                    div.className = `max-w-[80%] p-2 rounded-lg shadow-sm ${isA ? 'bg-blue-100 self-start border-l-4 border-blue-500' : 'bg-green-100 self-end border-r-4 border-green-500'}`;
                    let formattedContent = msg.content
                        .replace(/^###### (.+)$/gm, '<h6 class="text-xs font-semibold mt-1">$1</h6>')
                        .replace(/^##### (.+)$/gm, '<h5 class="text-sm font-semibold mt-2">$1</h5>')
                        .replace(/^#### (.+)$/gm, '<h4 class="text-base font-semibold mt-2">$1</h4>')
                        .replace(/^### (.+)$/gm, '<h3 class="text-lg font-semibold mt-2">$1</h3>')
                        .replace(/^## (.+)$/gm, '<h2 class="text-xl font-bold mt-3">$1</h2>')
                        .replace(/^# (.+)$/gm, '<h1 class="text-2xl font-bold mt-3 mb-1">$1</h1>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/\n\n/g, '</p><p class="mt-1">')
                        .replace(/\n/g, '<br>');
                    div.innerHTML = `<strong>${msg.sender}:</strong> <div class="mt-1 text-sm"><p>${formattedContent}</p></div>`;
                }
                
                chatWindow.appendChild(div);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

     </script>
</body>
</html>
